<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Donations - TNP OMS</title>
    <script src="tailwind.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <div class="bg-white shadow rounded-lg p-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-4">Donation Email Check</h1>
            <p class="text-gray-600 mb-4">This tool shows which Cash donations have valid email addresses for notifications.</p>
            
            <button id="checkBtn" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 mb-6">
                Check Donations
            </button>
            
            <div id="results" class="hidden">
                <div class="border-t pt-4">
                    <h3 class="font-semibold text-lg mb-2">Results:</h3>
                    <div id="summary" class="bg-blue-50 p-4 rounded mb-4"></div>
                    <div id="donationsList" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            db,
            collection,
            getDocs
        } from './firebase.js';

        document.getElementById('checkBtn').addEventListener('click', checkDonations);

        async function checkDonations() {
            const resultsDiv = document.getElementById('results');
            const summaryDiv = document.getElementById('summary');
            const listDiv = document.getElementById('donationsList');
            
            resultsDiv.classList.remove('hidden');
            summaryDiv.innerHTML = '<p class="text-blue-600">Loading donations...</p>';
            listDiv.innerHTML = '';
            
            try {
                const donationsCol = collection(db, 'donations');
                const donationsSnapshot = await getDocs(donationsCol);
                
                let totalDonations = 0;
                let cashDonations = 0;
                let cashWithEmail = 0;
                let cashWithoutEmail = 0;
                const donationDetails = [];
                
                donationsSnapshot.forEach((doc) => {
                    const donation = doc.data();
                    totalDonations++;
                    
                    const paymentMethod = donation.paymentMethod || donation.typeOfDonation || '';
                    
                    if (paymentMethod === 'Cash') {
                        cashDonations++;
                        
                        const email = donation.emailAddress || donation.email || '';
                        const name = donation.donorName || donation.name || '';
                        const amount = donation.amount || 0;
                        const date = donation.dateOfDonation || 'Unknown';
                        
                        const hasValidEmail = email && email !== 'Anonymous' && email.includes('@');
                        const hasValidName = name && name !== 'Anonymous';
                        
                        if (hasValidEmail && hasValidName) {
                            cashWithEmail++;
                        } else {
                            cashWithoutEmail++;
                        }
                        
                        donationDetails.push({
                            id: doc.id,
                            name: name || 'NOT SET',
                            email: email || 'NOT SET',
                            amount: amount,
                            date: date,
                            hasValidEmail: hasValidEmail,
                            hasValidName: hasValidName,
                            canReceiveEmail: hasValidEmail && hasValidName
                        });
                    }
                });
                
                // Summary
                summaryDiv.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-sm text-gray-600">Total Donations:</p>
                            <p class="text-2xl font-bold">${totalDonations}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-600">Cash Donations:</p>
                            <p class="text-2xl font-bold">${cashDonations}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-600">✅ With Valid Email:</p>
                            <p class="text-2xl font-bold text-green-600">${cashWithEmail}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-600">❌ Missing Email/Name:</p>
                            <p class="text-2xl font-bold text-red-600">${cashWithoutEmail}</p>
                        </div>
                    </div>
                `;
                
                // List details
                if (donationDetails.length === 0) {
                    listDiv.innerHTML = '<p class="text-yellow-600">⚠️ No Cash donations found in the database.</p>';
                } else {
                    listDiv.innerHTML = '<h4 class="font-semibold mb-2">Cash Donation Details:</h4>';
                    
                    donationDetails.forEach((d, index) => {
                        const statusIcon = d.canReceiveEmail ? '✅' : '❌';
                        const statusColor = d.canReceiveEmail ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200';
                        const statusText = d.canReceiveEmail ? 'CAN RECEIVE EMAILS' : 'CANNOT RECEIVE EMAILS';
                        
                        let issues = [];
                        if (!d.hasValidEmail) issues.push('No valid email');
                        if (!d.hasValidName) issues.push('No valid name');
                        
                        const issueText = issues.length > 0 ? `<span class="text-red-600 text-sm"> (${issues.join(', ')})</span>` : '';
                        
                        listDiv.innerHTML += `
                            <div class="border ${statusColor} p-4 rounded">
                                <div class="flex items-center justify-between">
                                    <div class="flex-1">
                                        <p class="font-semibold">${statusIcon} ${d.name} ${issueText}</p>
                                        <p class="text-sm text-gray-600">📧 ${d.email}</p>
                                        <p class="text-sm text-gray-600">💰 ₱${d.amount.toFixed(2)} | 📅 ${d.date}</p>
                                        <p class="text-xs text-gray-500">ID: ${d.id}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="px-3 py-1 rounded text-sm font-semibold ${d.canReceiveEmail ? 'bg-green-200 text-green-800' : 'bg-red-200 text-red-800'}">
                                            ${statusText}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                
                // Add recommendation
                if (cashWithoutEmail > 0) {
                    listDiv.innerHTML += `
                        <div class="bg-yellow-50 border border-yellow-200 p-4 rounded mt-4">
                            <p class="font-semibold text-yellow-800">⚠️ Action Required:</p>
                            <p class="text-sm text-yellow-700">You have ${cashWithoutEmail} Cash donation(s) that cannot receive email notifications.</p>
                            <p class="text-sm text-yellow-700 mt-2">To fix this:</p>
                            <ol class="list-decimal list-inside text-sm text-yellow-700 ml-4">
                                <li>Use the <strong>update-donor-emails.html</strong> tool to set all Cash donation emails to a test email</li>
                                <li>OR manually update each donation in Firebase to include 'emailAddress' and 'donorName' fields</li>
                            </ol>
                        </div>
                    `;
                }
                
            } catch (error) {
                summaryDiv.innerHTML = `<p class="text-red-600">❌ Error: ${error.message}</p>`;
                console.error('Error checking donations:', error);
            }
        }
    </script>
</body>
</html>
