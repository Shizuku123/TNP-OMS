<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Cash Donations - Debug Tool</title>
    <script src="tailwind.js"></script>
    <script type="module" src="firebase.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold mb-4 text-blue-600">💰 Cash Donations Diagnostic Tool</h1>
            <p class="text-gray-600 mb-6">This tool shows ALL donations with "Cash" payment method and their current amounts.</p>
            
            <button id="checkBtn" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 font-semibold">
                🔍 Check Cash Donations
            </button>
            
            <div id="results" class="mt-6 hidden">
                <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-4">
                    <h2 class="font-bold text-lg mb-2">📊 Summary</h2>
                    <div id="summary" class="space-y-2"></div>
                </div>
                
                <h2 class="font-bold text-lg mb-3">📋 All Donations (ordered by date - oldest first)</h2>
                <div id="donationsList" class="space-y-3"></div>
            </div>
            
            <div id="loading" class="hidden mt-6 text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                <p class="mt-2 text-gray-600">Loading donations...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, collection, getDocs, query, orderBy } from './firebase.js';

        document.getElementById('checkBtn').addEventListener('click', async function() {
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            const summaryDiv = document.getElementById('summary');
            const donationsListDiv = document.getElementById('donationsList');
            
            resultsDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            
            try {
                // Get all donations ordered by date
                const donationsCol = collection(db, 'donations');
                const q = query(donationsCol, orderBy('dateOfDonation', 'asc'));
                const snapshot = await getDocs(q);
                
                console.log('=== CASH DONATIONS DIAGNOSTIC ===');
                console.log('Total donations in database:', snapshot.size);
                
                let totalDonations = 0;
                let cashDonations = 0;
                let totalCashAmount = 0;
                let cashWithBalance = 0;
                let donationsHTML = '';
                
                snapshot.forEach((doc) => {
                    const donation = doc.data();
                    const paymentMethod = (donation.paymentMethod || donation.paymentType || 'Cash').toString().trim();
                    const normalizedMethod = paymentMethod.toLowerCase();
                    const amount = parseFloat(donation.amount || 0);
                    
                    totalDonations++;
                    
                    // Check if it's a Cash donation
                    if (normalizedMethod === 'cash') {
                        cashDonations++;
                        totalCashAmount += amount;
                        
                        if (amount > 0) {
                            cashWithBalance++;
                        }
                        
                        // Create donation card
                        const bgColor = amount > 0 ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500';
                        const statusIcon = amount > 0 ? '✅' : '❌';
                        
                        donationsHTML += `
                            <div class="${bgColor} border-l-4 p-4 rounded">
                                <div class="flex justify-between items-start">
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-2">
                                            <span class="text-2xl">${statusIcon}</span>
                                            <span class="font-bold text-lg">${donation.donorName || 'Anonymous'}</span>
                                        </div>
                                        <div class="space-y-1 text-sm text-gray-700">
                                            <p><strong>Email:</strong> ${donation.emailAddress || donation.email || 'No email'}</p>
                                            <p><strong>Payment Method:</strong> ${paymentMethod}</p>
                                            <p><strong>Date:</strong> ${donation.dateOfDonation || donation.date || 'Not specified'}</p>
                                            <p><strong>Donation ID:</strong> ${doc.id}</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-2xl font-bold ${amount > 0 ? 'text-green-600' : 'text-red-600'}">
                                            ₱${amount.toLocaleString('en-PH', {minimumFractionDigits: 2})}
                                        </div>
                                        <div class="text-xs text-gray-500 mt-1">
                                            ${amount > 0 ? 'Available' : 'Fully Used'}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        
                        console.log(`Cash Donation ${cashDonations}:`, {
                            id: doc.id,
                            donor: donation.donorName || 'Anonymous',
                            email: donation.emailAddress || donation.email || 'No email',
                            amount: amount,
                            paymentMethod: paymentMethod,
                            date: donation.dateOfDonation || donation.date
                        });
                    }
                });
                
                // Summary
                summaryDiv.innerHTML = `
                    <p class="text-gray-800">📦 <strong>Total Donations:</strong> ${totalDonations}</p>
                    <p class="text-gray-800">💵 <strong>Cash Donations:</strong> ${cashDonations}</p>
                    <p class="text-gray-800">✅ <strong>Cash with Balance > 0:</strong> ${cashWithBalance}</p>
                    <p class="text-gray-800">❌ <strong>Cash Fully Used:</strong> ${cashDonations - cashWithBalance}</p>
                    <p class="text-2xl font-bold mt-3 ${totalCashAmount > 0 ? 'text-green-600' : 'text-red-600'}">
                        💰 Total Cash Available: ₱${totalCashAmount.toLocaleString('en-PH', {minimumFractionDigits: 2})}
                    </p>
                `;
                
                if (cashDonations === 0) {
                    donationsListDiv.innerHTML = `
                        <div class="bg-red-50 border border-red-200 rounded p-6 text-center">
                            <p class="text-red-600 font-bold text-lg">⚠️ NO CASH DONATIONS FOUND!</p>
                            <p class="text-gray-600 mt-2">This is why the expense recording is failing.</p>
                            <p class="text-gray-600 mt-2">The TotalFunds shows ₱130,435.00 but there are no individual Cash donation records.</p>
                        </div>
                    `;
                } else {
                    donationsListDiv.innerHTML = donationsHTML;
                }
                
                console.log('\n=== SUMMARY ===');
                console.log('Total Donations:', totalDonations);
                console.log('Cash Donations:', cashDonations);
                console.log('Cash with Balance:', cashWithBalance);
                console.log('Total Cash Amount:', totalCashAmount);
                
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                
            } catch (error) {
                console.error('Error checking donations:', error);
                loadingDiv.classList.add('hidden');
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
